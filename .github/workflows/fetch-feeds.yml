name: Fetch RSS Feeds

on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 3 volte al giorno: 6:00, 12:00, 18:00 UTC
  workflow_dispatch:              # permette avvio manuale dal sito GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch feeds e genera feeds.json
        run: python3 scripts/fetch_feeds.py

      - name: Commit e push feeds.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feeds.json
          git diff --staged --quiet || git commit -m "update feeds $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
